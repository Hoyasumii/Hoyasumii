<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Open Graph cover</title>
		<script src="theme.js"></script>
		<link rel="stylesheet" href="tokens.css" />
		<style>
			/* 1200x630, the size link previews use. The hero of the site: top bar, name, meta. */
			.cover {
				position: relative;
				width: 1200px;
				height: 630px;
				overflow: hidden;
				background: var(--paper);
				color: var(--ink);
			}

			.bar {
				display: grid;
				grid-template-columns: 1fr auto 1fr;
				align-items: center;
				height: 84px;
				padding: 0 64px;
				border-bottom: 1.5px solid var(--rule);
				font-size: 20px;
			}

			.bar__center {
				color: var(--muted);
			}

			.bar__end {
				justify-self: end;
				color: var(--muted);
			}

			.name {
				position: absolute;
				top: 136px;
				left: 64px;
				margin: 0;
				font-size: 297px;
				line-height: 0.8;
			}

			.name__line {
				display: block;
				/* Each line trimmed to its caps: the block starts at the top of ALAN. */
				text-box: trim-both cap alphabetic;
			}

			.name__line + .name__line {
				margin-top: calc(0.8em - 1cap);
				padding-left: 96px;
				color: var(--accent);
			}

			.meta {
				position: absolute;
				right: 64px;
				bottom: 52px;
				margin: 0;
				padding: 0;
				list-style: none;
				font-size: 22px;
				line-height: 34px;
				text-align: right;
				color: var(--muted);
				text-box: trim-end alphabetic;
			}

			.meta__lead {
				color: var(--ink);
			}

			.meta__lead::before {
				content: "";
				display: inline-block;
				width: 12px;
				height: 12px;
				margin-right: 14px;
				border-radius: 50%;
				background: var(--accent);
				vertical-align: 0.1em;
			}
		</style>
	</head>
	<body>
		<main class="cover">
			<header class="bar label">
				<span>Hoyasumii</span>
				<span class="bar__center">Aracaju, Brasil</span>
				<span class="bar__end">hoyasumii.dev</span>
			</header>
			<h1 class="name display">
				<span class="name__line">Alan</span>
				<span class="name__line">Reis</span>
			</h1>
			<ul class="meta label">
				<li class="meta__lead">Fullstack developer</li>
				<li>TypeScript · Bun · MCP</li>
				<li>SDK · CLI · Agents</li>
			</ul>
		</main>
	</body>
</html>
